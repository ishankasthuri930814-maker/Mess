name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Fallback Google API Key if google-services.json is absent
        run: |
          if [ ! -f "app/google-services.json" ]; then
            STRINGS_FILE="app/src/main/res/values/strings.xml"
            if [ -f "$STRINGS_FILE" ] && ! grep -q "google_api_key" "$STRINGS_FILE"; then
              sed -i '/<\/resources>/i \    <string name="google_api_key">AIzaSy_placeholder_key</string>' "$STRINGS_FILE"
            fi
          fi

      - name: Ensure env placeholder for Secrets plugin
        run: |
          if [ ! -f ".env" ] && [ ! -f ".env.example" ]; then
            touch .env.example
          fi

      - name: Install Gradle 9.3.1 and Build Debug APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle-9.3.1-bin.zip -d "$HOME"
          export PATH="$HOME/gradle-9.3.1/bin:$PATH"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: All-In-One-Police-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
